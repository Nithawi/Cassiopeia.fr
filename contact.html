<html lang="fr">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles-contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Cassiopeia Space</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Iceland&family=Noto+Sans+JP:wght@100..900&family=Playball&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Diplomata&family=Iceberg&family=Iceland&family=Megrim&family=Noto+Sans+JP:wght@100..900&family=Playball&display=swap');
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo-groupe">
                <a href="index.html"><img src="image/logo_blanc.png" alt="logo" class="logo" width="100px"></a>
                <h1 class="logo_nom">Cassiopeia</h1>
            </div>
            <button class="nav_mobile" id="nav-mobile" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <ul id="nav-liens">
                <li><a class ="nav_text" href="index.html"><i class="fa-solid fa-rocket"></i><b>Accueil</b></a></li>
                <li><a class ="nav_text" href="presentation.html"><i class="fa-regular fa-address-card"></i></i><b>Présentation</b></a></li>
                <li><a class ="nav_text" href="contact.html"><i class="fa-solid fa-satellite-dish"></i><b>Contact</b></a></li>
            </ul>
        </nav>
    </header>

    <div class="contact">
        <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="47b3a1fb-6d71-4925-a66a-e9d02a651aa9">
        <input type="hidden" name="redirect" value="https://www.cassiopeia-space.fr/merci">
        <!-- tes champs ici -->
            <h2>Contactez-moi</h2>
            <div class ="separation"></div>
            <div class="corps">

                <div class = "gauche">
                    <div class="groupe">
                        <label>Prénom :</label>
                        <input type="text" name="prenom">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </div>
                    <div class="groupe">
                        <label>Nom : <span class="required">*</span></label>
                        <input type="text" name="nom" required>
                        <i class="fa-regular fa-chess-queen"></i>
                    </div>
                    <div class = "groupe">
                        <label>Email : <span class="required">*</span></label>
                        <input type="email" name="email" required>
                        <i class="fa-solid fa-at"></i>
                    </div>
                    <div class = "groupe">
                        <label>Telephone :</label>
                        <input type="text" name="telephone">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                    </div>

                    <p class="mention"><span class="required">*</span> Champs obligatoires</p>

                </div>         
                <div class="droite ">
                    <div class="groupe">
                        <label>Message : <span class="required">*</span></label>
                        <textarea placeholder="Saisissez votre message..." name="message" required></textarea>
                    </div>


                    <div class="envoi">
                        <button type="submit"><i class="fa-brands fa-galactic-senate"></i> Envoyer le message </button>
                    </div>
                </div>
            </div>
        </form>
    </div>


<footer> 
    <div class="logo_nom">Cassiopeia</div>
    <p>Merci de votre visite !</p>
    </div>
    <div class="footerinfo">
        <p>Cassiopeia Space</p>
        <p class="date">25/01/2026</p>
    </div>
</footer>

<script src="nav-mobile.js"></script>
</body>
</html>
